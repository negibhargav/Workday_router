      operationId: retrieves_a_collection_of_direct_reports_for_a_specific_worker
      x-module: workers
      x-action: read
      x-scope: collection
      x-intent-triggers:
        - "who reports to this person"
        - "list direct reports"
        - "get team members"
        - "show subordinates"
        - "fetch reportees"
        - "who does this manager manage"
        - "employee's team"
        - "show people under this manager"
      parameters:
        - name: ID
          in: path
          required: true
          schema:
            type: string
            pattern: '^(([0-9a-f]{32})|(\S+=\S+))$'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Successfully retrieved a collection of direct reports.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        descriptor:
                          type: string
                        href:
                          type: string
                        businessTitle:
                          type: string
                        isManager:
                          type: boolean
                        primaryWorkEmail:
                          type: string
                        primaryWorkPhone:
                          type: string
                        primarySupervisoryOrganization:
                          type: object
